name: Synchronisation Stripe

# À chaque publication du catalogue par l'admin, crée automatiquement dans
# Stripe les produits et liens de paiement des articles qui ont un prix,
# et écrit les liens dans data/catalogue.json (bouton « Acheter en ligne »).
# Tant que le secret STRIPE_SECRET_KEY n'existe pas, le job ne fait rien.

on:
  push:
    branches: [main]
    paths: [data/catalogue.json]
  workflow_dispatch:

concurrency:
  group: stripe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Synchroniser le catalogue avec Stripe
        run: node .github/scripts/stripe-sync.js
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SITE_URL: https://lageode66.fr

      # Publication robuste : si un autre commit arrive pendant le job (la gérante
      # qui publie, l'autre robot), on ne relance PAS Stripe (risque de doublons) :
      # on superpose les liens calculés sur la toute dernière version, et on
      # réessaie le push jusqu'à réussir.
      - name: Publier les liens de paiement
        run: |
          if git diff --quiet data/catalogue.json; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git config user.name "stripe-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/catalogue.json /tmp/robot.json
          for tentative in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            git show origin/main:data/catalogue.json > /tmp/base.json
            node .github/scripts/reconcile-robot.js /tmp/robot.json /tmp/base.json data/catalogue.json
            if git diff --quiet data/catalogue.json; then
              echo "Déjà à jour sur la dernière version."
              exit 0
            fi
            git add data/catalogue.json
            git commit -q -m "Stripe : liens de paiement mis à jour automatiquement"
            if git push -q origin HEAD:main; then
              echo "Publié (tentative $tentative)."
              exit 0
            fi
            echo "Push rejeté (la branche a bougé), nouvelle tentative..."
            git reset -q --hard origin/main
            sleep $((RANDOM % 4 + 2))
          done
          echo "::error::Échec de la publication après plusieurs tentatives."
          exit 1
