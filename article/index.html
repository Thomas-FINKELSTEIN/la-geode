<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — La Géode le Showroom</title>
  <meta name="description" content="Détail d'un article de La Géode le Showroom, boutique de minéraux et lithothérapie à Saint-Génis-des-Fontaines.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,4 88,38 50,96 12,38' fill='%23b795e3'/%3E%3Cpolygon points='50,4 70,38 50,96 30,38' fill='%23d6c8ee'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <script src="../script.js" defer></script>
</head>
<body>

  <header class="site-header">
    <a class="brand" href="../">
      <div class="brand-name">La Géode</div>
      <div class="brand-sub">Le Showroom</div>
    </a>
    <nav class="site-nav">
      <a class="nav-link" href="../#univers">Nos univers</a>
      <a class="btn-pill" href="../#infos">Nous rendre visite</a>
    </nav>
  </header>

  <main class="page">
    <div class="page-inner page-wide">
      <a class="retour" id="retour" href="../#univers">← Retour</a>
      <div id="article-root"></div>

    </div>

    <footer class="site-footer">
      <div>© 2026 La Géode le Showroom — SARL Franck et David</div>
      <div class="footer-links">
        <a href="../mentions-legales/">Mentions légales</a>
        <a href="../faq/">FAQ</a>
      </div>
    </footer>
  </main>

  <script>
  (function () {
    var TEL = '+33468566053';
    var TEL_AFFICHE = '04 68 56 60 53';

    function esc(s) {
      return String(s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }

    function prixLabel(prix) {
      if (prix === null || prix === undefined || prix === '') return 'Prix en boutique';
      var n = Number(prix);
      if (isNaN(n)) return esc(prix);
      return n.toLocaleString('fr-FR', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + ' €';
    }

    function photoSrc(photo) {
      return /^https?:/.test(photo) ? photo : '../' + photo;
    }

    function findArticle(data, id) {
      var res = null;
      Object.keys(data.themes).forEach(function (key) {
        var theme = data.themes[key];
        (theme.familles || []).forEach(function (fam) {
          (fam.articles || []).forEach(function (art) {
            if (art.id === id) res = { article: art, famille: fam, theme: theme, themeKey: key };
          });
        });
      });
      return res;
    }

    function renderIntrouvable(root) {
      root.innerHTML =
        '<h1>Article introuvable</h1>' +
        '<p class="lead">Cet article n\'est plus dans le catalogue en ligne — mais nous l\'avons peut-être en boutique. ' +
        'Appelez-nous au <a href="tel:' + TEL + '">' + TEL_AFFICHE + '</a>.</p>';
    }

    function render(root, found) {
      var a = found.article;
      document.title = a.nom + ' — La Géode le Showroom';

      var html = '<div class="article-layout" data-reveal="0">';
      html += '<div class="article-photo">';
      if (a.photo) {
        html += '<img src="' + esc(photoSrc(a.photo)) + '" alt="' + esc(a.nom) + '">';
      } else {
        html += '<div class="item-noimg">◆</div>';
      }
      html += '</div>';

      html += '<div class="article-info">';
      html += '<div class="item-contexte">' + esc(found.theme.nom + ' · ' + found.famille.nom) + '</div>';
      html += '<h1>' + esc(a.nom) + '</h1>';
      html += '<div class="article-prix">' + prixLabel(a.prix) + '</div>';
      if (a.description) html += '<p class="article-desc">' + esc(a.description) + '</p>';
      html += '<div class="article-ctas">';
      if (a.stripe) {
        html += '<a class="btn-primary" href="' + esc(a.stripe) + '" target="_blank" rel="noopener">Acheter en ligne</a>';
        html += '<a class="btn-ghost" href="tel:' + TEL + '">📞 ' + TEL_AFFICHE + '</a>';
      } else {
        html += '<a class="btn-primary" href="tel:' + TEL + '">📞 Réserver : ' + TEL_AFFICHE + '</a>';
        html += '<a class="btn-ghost" href="../#infos">Horaires &amp; accès</a>';
      }
      html += '</div>';
      if (a.stripe) {
        html += '<p class="article-note">Paiement en ligne sécurisé par Stripe — retrait de votre article au showroom, 15 Avenue du Maréchal Joffre, Saint-Génis-des-Fontaines.</p>';
      } else {
        html += '<p class="article-note">Article disponible au showroom — 15 Avenue du Maréchal Joffre, Saint-Génis-des-Fontaines.</p>';
      }
      html += '</div></div>';

      root.innerHTML = html;

      var retour = document.getElementById('retour');
      retour.href = '../' + found.themeKey + '/';
      retour.textContent = '← Retour aux ' + found.theme.nom.toLowerCase();

      if (window.initReveal) window.initReveal(root);
    }

    document.addEventListener('DOMContentLoaded', function () {
      var root = document.getElementById('article-root');
      var params = new URLSearchParams(location.search);
      var id = params.get('id');
      if (!id) { renderIntrouvable(root); return; }

      fetch('../data/catalogue.json?v=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (data) {
          var found = findArticle(data, id);
          if (found) render(root, found); else renderIntrouvable(root);
        })
        .catch(function () { renderIntrouvable(root); });
    });
  })();
  </script>

</body>
</html>
